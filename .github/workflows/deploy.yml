name: Deploy to EC2

on:
  push:
    branches:
      - main


jobs:

  # -----------------------------
  # Job 1: Terraform Infrastructure
  # -----------------------------

  terraform:

    name: Terraform Apply

    runs-on: ubuntu-latest

    outputs:
      ec2_ip: ${{ steps.get_ip.outputs.ip }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Terraform Init
        working-directory: terraform
        run: terraform init


      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan


      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: get EC2 public Ip
        id: get_ip
        working-directory: terraform
        run:
          echo "ip=$(terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT

  # -----------------------------
  # Job 2: Application Deployment
  # -----------------------------

  deploy:

    name: Deploy Docker Application

    runs-on: ubuntu-latest


    needs: terraform


    steps:

      - name: Deploy to EC2

        uses: appleboy/ssh-action@v1.0.3

        with:

          host: ${{ needs.terraform.outputs.ec2_ip }}

          username: ${{ secrets.EC2_USER }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}


          script: |
            echo "Waiting for Docker installation..."
            until command -v docker >/dev/null 2>&1
            do
              echo "Docker not installed yet, waiting..."
              sleep 10
            done


            echo "Docker is installed"

            if [ ! -d "/home/ubuntu/devops" ]; then
              cd /home/ubuntu
              git clone https://github.com/Vinuthads/devops.git
            else
              cd /home/ubuntu/devops
              git pull origin main
            fi

            cd ${{ secrets.PROJECT_PATH }}

            sudo docker compose up --build -d

            sudo docker image prune -f
