name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:

  # -----------------------------
  # Job 1: Terraform Infrastructure
  # -----------------------------
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    outputs:
      ec2_ip: ${{ steps.get_ip.outputs.ip }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get EC2 Public IP
        id: get_ip
        working-directory: terraform
        run: |
          echo "ip=$(terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT

  # -----------------------------
  # Job 2: Deploy Application
  # -----------------------------
  deploy:
    name: Deploy Docker Application
    runs-on: ubuntu-latest
    needs: terraform

    steps:

      - name: Wait for DNS propagation
        run: sleep 60

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ needs.terraform.outputs.ec2_ip }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |

            echo "Waiting for Docker installation..."

            until command -v docker >/dev/null 2>&1
            do
              echo "Docker not installed yet..."
              sleep 10
            done

            until sudo systemctl is-active --quiet docker
            do
              echo "Waiting for Docker service..."
              sleep 5
            done

            echo "Docker is ready."

            if [ ! -d "/home/ubuntu/devops" ]; then
              cd /home/ubuntu
              git clone https://github.com/Vinuthads/devops.git
            else
              cd /home/ubuntu/devops
              git pull origin main
            fi

            cd /home/ubuntu/devops

            # Create temporary certificate if Let's Encrypt certificate doesn't exist
            if [ ! -f "./certbot/conf/live/resilientbeing.online/fullchain.pem" ]; then

              echo "Creating temporary self-signed certificate..."

              sudo mkdir -p ./certbot/conf/live/resilientbeing.online

              sudo openssl req \
                -x509 \
                -nodes \
                -newkey rsa:2048 \
                -days 1 \
                -keyout ./certbot/conf/live/resilientbeing.online/privkey.pem \
                -out ./certbot/conf/live/resilientbeing.online/fullchain.pem \
                -subj "/CN=resilientbeing.online"

            fi

            echo "Starting Docker containers..."

            sudo docker compose up --build -d

            echo "Waiting for Nginx..."
            sleep 15

            # Obtain Let's Encrypt certificate only once
            if [ ! -f "./certbot/conf/live/resilientbeing.online/.le-created" ]; then

              echo "Obtaining Let's Encrypt certificate..."

              sudo docker compose run --rm certbot certonly \
                --webroot \
                --webroot-path=/var/www/certbot \
                -d resilientbeing.online \
                -d www.resilientbeing.online \
                --agree-tos \
                --register-unsafely-without-email

              sudo touch ./certbot/conf/live/resilientbeing.online/.le-created

              echo "Reloading Nginx..."

              sudo docker compose restart nginx

            else

              echo "Let's Encrypt certificate already exists."

            fi

            sudo docker image prune -f

            echo "Deployment completed successfully."
