name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:

  # -----------------------------
  # Job 1: Terraform Infrastructure
  # -----------------------------
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    outputs:
      ec2_ip: ${{ steps.get_ip.outputs.ip }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get EC2 Public IP
        id: get_ip
        working-directory: terraform
        run: |
          echo "ip=$(terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT

  # -----------------------------
  # Job 2: Deploy Application
  # -----------------------------
  deploy:
    name: Deploy Docker Application
    runs-on: ubuntu-latest
    needs: terraform

    steps:

      - name: Wait for DNS propagation
        run: sleep 60

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ needs.terraform.outputs.ec2_ip }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            echo "Waiting for Docker installation..."
            until command -v docker >/dev/null 2>&1; do
              echo "Docker not installed yet..."
              sleep 10
            done

            until sudo systemctl is-active --quiet docker; do
              echo "Waiting for Docker service..."
              sleep 5
            done

            echo "Docker is ready."

            # Clone repository if required
            if [ ! -d "/home/ubuntu/devops" ]; then
              cd /home/ubuntu
              git clone https://github.com/Vinuthads/devops.git
            fi

            cd /home/ubuntu/devops
            git pull origin main

            DOMAIN="resilientbeing.online"
            CERT_DIR="./certbot/conf/live/$DOMAIN"

            # Ensure webroot exists
            mkdir -p ./certbot/www
            chmod -R 777 ./certbot/www

            #########################################################
            # Create temporary certificate only if none exists
            #########################################################

            if [ ! -f "$CERT_DIR/fullchain.pem" ] || [ ! -f "$CERT_DIR/privkey.pem" ]; then
          
                echo "Creating temporary self-signed certificate..."
          
                sudo mkdir -p "$CERT_DIR"
          
                sudo openssl req \
                    -x509 \
                    -nodes \
                    -newkey rsa:2048 \
                    -days 1 \
                    -keyout "$CERT_DIR/privkey.pem" \
                    -out "$CERT_DIR/fullchain.pem" \
                    -subj "/CN=$DOMAIN"
          
            fi

            #########################################################
            # Start application
            #########################################################
          
            sudo docker compose up --build -d
          
            echo "Waiting for nginx..."
            sleep 15
          
            #########################################################
            # Check certificate issuer
            #########################################################

            ISSUER=""
        
            if [ -f "$CERT_DIR/fullchain.pem" ]; then
              ISSUER=$(openssl x509 -in "$CERT_DIR/fullchain.pem" -noout -issuer || true)
            fi
        
            #########################################################
            # First deployment (self-signed certificate)
            #########################################################                                  

            if echo "$ISSUER" | grep -qi "CN=$DOMAIN"; then
          
                echo "Self-signed certificate detected."
          
                sudo docker compose run --rm certbot certonly \
                    --webroot \
                    --webroot-path=/var/www/certbot \
                    -d "$DOMAIN" \
                    --agree-tos \
                    --register-unsafely-without-email \
                    --non-interactive
          
                echo "Reloading nginx..."
          
                sudo docker compose restart nginx
          
            #########################################################
            # Existing Let's Encrypt certificate
            #########################################################

            else
          
                echo "Let's Encrypt certificate found."
          
                sudo docker compose run --rm certbot renew
          
                echo "Reloading nginx..."
          
                sudo docker compose restart nginx
          
            fi
          
            #########################################################
            # Cleanup
            #########################################################

            sudo docker image prune -f

            echo "Deployment completed successfully."
