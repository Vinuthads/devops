events {
    worker_connections 1024;
}

http {
    include mime.types;

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name resilientbeing.online www.resilientbeing.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;

        server_name resilientbeing.online www.resilientbeing.online;

        ssl_certificate /etc/letsencrypt/live/resilientbeing.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/resilientbeing.online/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files  $uri $uri/ /index.html;
        }

        location /ws {
            proxy_pass http://backend:8000/ws;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
	    proxy_send_timeout 86400s;
        }
    }
}
